# L2-MANUAL-QUALITY: inactive here; copy the whole file at the activation step.
name: Lab 2 Terraform Quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab02-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lab 2 quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: "true"
      CHECKOV_TELEMETRY: "false"
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Set up Python for Checkov
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the CLI version
        run: |
          terraform version -json | python -c 'import json, sys; assert json.load(sys.stdin)["terraform_version"] == "1.16.3"'

      - name: Check Terraform formatting
        working-directory: src/terraform
        run: terraform fmt -check -recursive

      - name: Initialize without a backend or lock changes
        working-directory: src/terraform
        run: |
          test -f .terraform.lock.hcl
          terraform init -backend=false -lockfile=readonly -input=false -no-color

      - name: Validate configuration, not Azure access
        working-directory: src/terraform
        run: terraform validate -no-color

      - name: Install the pinned scanner
        run: python -m pip install --disable-pip-version-check checkov==3.3.19

      - name: Run blocking local-source scan
        run: checkov -d src/terraform --framework terraform --download-external-modules false

      - name: Record the exact check context
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECK_REF: ${{ github.ref }}
          CHECK_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ job.status }}
        run: |
          {
            printf '## Lab 2 credential-free quality\n\n'
            printf -- '- Event: `%s`\n- Ref: `%s`\n- Evaluated SHA: `%s`\n' "$EVENT_NAME" "$CHECK_REF" "$CHECK_SHA"
            printf -- '- PR head SHA (empty for dispatch): `%s`\n- Job status: `%s`\n' "$PR_HEAD_SHA" "$RESULT"
            printf '\nCheckov scans src/terraform without downloading external modules. An AzAPI scan may have zero applicable checks; this is not complete AVM coverage.\n'
            printf '\nNo Azure login, backend, plan, apply, OIDC permission, SARIF upload, or environment is configured.\n'
          } >> "$GITHUB_STEP_SUMMARY"
